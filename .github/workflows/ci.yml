name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Ubuntu runners cannot install OTP 21-23. Windows retains
          # coverage of the oldest declared Elixir release and legacy Travis CI.
          - os: windows-2022
            elixir: '1.9.4'
            otp: '22.3'
          - os: windows-2022
            elixir: '1.10.4'
            otp: '22.3'
          - os: windows-2022
            elixir: '1.11.4'
            otp: '23.3'
          - os: ubuntu-22.04
            elixir: '1.14.5'
            otp: '25.3'
          - os: ubuntu-24.04
            elixir: '1.18.6'
            otp: '27.3'
          - os: ubuntu-24.04
            elixir: '1.19.7'
            otp: '28.5'
          - os: ubuntu-24.04
            elixir: '1.20.5'
            otp: '28.5'
    env:
      MIX_ENV: test
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: false
      - name: Install dependencies
        run: mix deps.get --only test
      - name: Run tests
        run: mix test
      - name: Check formatting
        if: matrix.elixir == '1.11.4'
        run: mix format --check-formatted
      - name: Check code quality
        if: matrix.elixir == '1.20.5'
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix credo --strict --format=oneline
      - name: Compile development tools and build documentation
        if: matrix.elixir == '1.20.5'
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix compile
          mix docs
